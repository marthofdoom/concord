name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: rustfmt
        run: cargo fmt --all -- --check

      # --locked makes CI fail when Cargo.lock is stale instead of silently re-resolving.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      # Generic patterns only; nobody's name list belongs in CI.
      - name: Leak scan
        run: cargo run -p concord-pve --locked --features capture --example leakscan

  template:
    name: Container template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools fakeroot xz-utils
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Static musl binaries; every Alpine input is checked against alpine.lock.
      - name: Build template
        run: deploy/ct/build-template.sh --out "$RUNNER_TEMP/ct"
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Upgrade and rollback against a stub container
        run: deploy/ct/tests/upgrade.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concord-ct-template
          path: ${{ runner.temp }}/ct/concord-*-amd64.tar.xz*
          if-no-files-found: error
