name: Release

# Publishing is a tag push. workflow_dispatch is a dry run: it builds and
# verifies everything from main and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Verify, test, build
    # A dry run is only meaningful from main; anything else is refused.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      # Only the ref that triggered this run: a tag pushed by a maintainer, or main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools fakeroot xz-utils
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl

      # checkout can flatten an annotated tag; fetch the tag object itself.
      - name: Check the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          scripts/release.sh check-tag "$TAG"

      - name: Read the version and the release notes
        id: ver
        run: |
          v=$(scripts/release.sh version)
          scripts/release.sh notes "$v" >/dev/null
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Leak scan
        run: cargo run -p concord-pve --locked --features capture --example leakscan

      - name: Build template and concordctl
        run: deploy/ct/build-template.sh --out "$RUNNER_TEMP/ct"
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Upgrade and rollback against a stub container
        run: deploy/ct/tests/upgrade.sh

      # The agent binary (CON-44) is deliberately not shipped yet.
      - name: Assemble and verify
        id: pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          scripts/release.sh assemble --version "$VERSION" --template-dir "$RUNNER_TEMP/ct" \
            --concordctl target/x86_64-unknown-linux-musl/release/concordctl --out "$RUNNER_TEMP/release"
          echo "sums=$(sha256sum "$RUNNER_TEMP/release/SHA256SUMS" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concord-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create and publish the release
      actions: read # download the build job's artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the build output
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: gh run download "$RUN_ID" --repo "$REPO" --name concord-release --dir "$RUNNER_TEMP/release"

      - name: Check it is what the build job produced
        env:
          WANT: ${{ needs.build.outputs.sums }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ $(sha256sum "$RUNNER_TEMP/release/SHA256SUMS" | cut -d' ' -f1) == "$WANT" ]]
          scripts/release.sh verify "$RUNNER_TEMP/release" "$VERSION"

      # Draft, upload, re-download and compare, and only then publish.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/release.sh publish "$TAG" "$RUNNER_TEMP/release"
