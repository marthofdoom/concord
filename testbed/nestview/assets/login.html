<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nestview: log in</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="login">
  <section class="card">
    <h2>nestview</h2>
    <p class="muted">Nested PVE test estate. Enter the dashboard passphrase.</p>
    <!--MSG-->
    <form method="post" action="login">
      <input type="password" name="passphrase" autocomplete="current-password" maxlength="1024" required autofocus>
      <button type="submit">log in</button>
    </form>
  </section>
</main>
</body>
</html>
