#!/usr/sbin/nft -f
# nestview container (CT 9004) firewall. Installed as /etc/nftables.conf and
# loaded by nftables.service, which nestview.service requires.
#
# Inbound: only the operator's address (OPERATOR_IP) may reach the UI
# (tcp 8099) or SSH. ICMP is allowed so the CT can be pinged and so path MTU
# discovery and IPv6 neighbour discovery work. Everything else is dropped and
# counted (`nft list counter inet nestview dropped_in`).
#
# Outbound stays open: nestview must reach the PVE API,
# and the CT needs DHCP, DNS and apt.

flush ruleset

# Replace OPERATOR_IP; the ruleset does not load until it is an address.
define operator = OPERATOR_IP
define ui_port = 8099

table inet nestview {
	counter dropped_in {
		comment "inbound packets dropped"
	}
	counter dropped_fwd {
		comment "forwarded packets dropped"
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid counter name "dropped_in" drop

		ip saddr $operator tcp dport $ui_port accept
		ip saddr $operator tcp dport 22 accept

		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept

		# DHCP replies arrive before conntrack has seen the broadcast
		# request as a flow, so accept them explicitly (bridge vmbr0, ip=dhcp).
		udp sport 67 udp dport 68 accept

		counter name "dropped_in" drop
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		counter name "dropped_fwd" drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
