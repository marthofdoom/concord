[package]
name = "nestview"
description = "Dashboard and manual test controls for the nested PVE test estate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "nestview"
path = "src/main.rs"

[dependencies]
concord-pve = { path = "../../crates/concord-pve" }
anyhow.workspace = true
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Session ids and audit request ids from the OS RNG. Already in the tree
# through ring (same 0.2 line), so no new crate.
getrandom = "0.2"
# Passphrase digest and constant-time compare, plus wiping secret buffers.
# All three are already in the tree through concord-pve.
sha2 = "0.11"
subtle = "2"
zeroize = "1"
# Only to build the base URL HttpPveClient::new takes (reqwest::Url is url::Url);
# already in the tree through reqwest.
url = "2"

[dev-dependencies]
concord-pve = { path = "../../crates/concord-pve", features = ["mock"] }
tower = { version = "0.5", features = ["util"] }
# To implement PveApi (an async_trait) for a test double that panics; already
# in the tree through concord-pve.
async-trait = "0.1"
# Paused clock for the disconnect test; a feature of the tokio already used.
tokio = { workspace = true, features = ["test-util"] }
