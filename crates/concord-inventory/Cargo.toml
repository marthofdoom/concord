[package]
name = "concord-inventory"
description = "Concord's read-only estate inventory: polls each host's guests into one atomically published snapshot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
concord-core = { path = "../concord-core" }
concord-pve = { path = "../concord-pve" }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
async-trait = "0.1"
concord-pve = { path = "../concord-pve", features = ["mock", "capture"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
