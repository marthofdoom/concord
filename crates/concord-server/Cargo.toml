[package]
name = "concord-server"
description = "Concord's orchestrator. So far it serves health, version and the read-only estate inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "concord_server"
path = "src/lib.rs"

[[bin]]
name = "concord"
path = "src/main.rs"

[dependencies]
concord-config = { path = "../concord-config" }
concord-core = { path = "../concord-core" }
concord-inventory = { path = "../concord-inventory" }
concord-pve = { path = "../concord-pve" }
anyhow.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rcgen = "0.13"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "json"] }
tempfile = "3"
concord-pve = { path = "../concord-pve", features = ["mock", "capture"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["net", "io-util"] }
