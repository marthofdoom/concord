[package]
name = "concord-server"
description = "Concord's orchestrator. So far it serves health, version and the read-only estate inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "concord_server"
path = "src/lib.rs"

[[bin]]
name = "concord"
path = "src/main.rs"

[dependencies]
concord-config = { path = "../concord-config" }
concord-core = { path = "../concord-core" }
concord-inventory = { path = "../concord-inventory" }
concord-pve = { path = "../concord-pve" }
anyhow.workspace = true
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
concord-pve = { path = "../concord-pve", features = ["mock", "capture"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
